<div>
  <div class="flex md:justify-content-between flex-wrap gap-2 pb-3 justify-content-center">
    <div class="">
      <p-button *ngIf="showAddButton" label="{{'bq-start.buttons.new' | translate}}" icon="pi pi-plus" (onClick)="gotoAddView()"></p-button>
    </div>

    <div class="flex justify-content-end" *ngIf="filters.length>0">
      <bq-chips-menu
        placeholder="{{'bq-start.filters.search' | translate}}"
        [(ngModel)]="appliedFilters"
        (onAdd)="onAdd($event)"
        (onRemove)="onRemove($event)"
        [filters]="filters">
        <ng-template let-item pTemplate="item">
          <span class="pi pi-filter p-mr-2"></span> {{item}}
        </ng-template>
      </bq-chips-menu>

      <div class="flex pl-1 align-items-center">
        <p-button
          icon="pi pi-filter"
          (click)="menu.toggle($event)"
          rounded="true"
        ></p-button>
      </div>

      <p-menu #menu [model]="filterMenuItems()" class="flex justify-center" styleClass="" [popup]="true">
        <ng-template #item let-item>
          @if (item.label){
          <a pRipple class="flex items-center p-menu-item-link" (click)="addCondition()">
            <span> {{item.label}} </span>
          </a>
          } @else {
          <a pRipple class="flex items-center p-menu-item-link" (click)="pfMenuClicked(item, $event)">
            <i class="pi pi-filter" *ngIf="item.isSelected"></i>
            <span [ngStyle]="{'font-weight': item.isSelected ? 'bold' : ''}">
              {{item.filterName}}
            </span>
          </a>
          }
        </ng-template>
      </p-menu>
    </div>
  </div>
  @if (customFilters.length>0){
  <div class="flex flex-wrap gap-2 justify-content-center md:justify-content-end">
    <form #customFiltersForm="ngForm" class="">
      <div class="flex flex-row gap-1" *ngFor="let cf of customFilters; let i = index">
        <div class="mb-2">
          <bq-table-custom-filter [formName]="('cfField' + i)" [filterClause]="cf" [filters]="filters.toArray()">
          </bq-table-custom-filter>
        </div>
      </div>
      <div class="flex justify-content-center md:justify-content-end gap-2">
        <p-button icon="pi pi-check" label="{{'bq-start.buttons.applyFilter' | translate}}" (click)="apply()"></p-button>
        <p-button icon="pi pi-times" label="{{'bq-start.buttons.cancel' | translate}}" (click)="removeAllCondition()" severity="warn"></p-button>
      </div>
      </form>
  </div>
  }
</div>
