<div class="dock-app">
  <bq-top-menu-bar
    *ngIf="showMenuOnTop"
    (onTopRightMenuClicked)="handleTopMenuClick($event)"
    [topRightMenuTemplate]="customTopRightMenuTemplate"
  ></bq-top-menu-bar>
  <bq-top-bar
    *ngIf="!showMenuOnTop"
    (menuButtonClick)="onMenuButtonClick()"
  ></bq-top-bar>
  <bq-menu-bar *ngIf="showLeftMenu" [active]="menuActive"></bq-menu-bar>

  <div class="ml-2 mr-2 mt-0 pt-0">
    <div class="flex flex-row justify-content-start pl-2">
      <breadcrumb></breadcrumb>
    </div>
      <p-panel styleClass="dock-window">
      <view-wrapper>
        <ng-content></ng-content>
        </view-wrapper>
      </p-panel>

    <div [ngClass]="{'stick-footer': stickyFooter}">
      <ng-container
        [ngTemplateOutlet]="controlFooterTemplate"
        *ngIf="isAuthenticated"
      ></ng-container>
    </div>
  </div>

  <p-toast></p-toast>

  <ng-template #defaultFooterTemplate>
    <bq-footer-bar></bq-footer-bar>
  </ng-template>

  <ng-template #defaultTopRightTemplate> </ng-template>

  <ng-keyboard-shortcuts
    [shortcuts]="keySvc.shortcuts()"
  ></ng-keyboard-shortcuts>
  <ng-keyboard-shortcuts-help
    [key]="'f1'"
    [closeKey]="'escape'"
    [title]="'Keyboard Shortcuts'"
  ></ng-keyboard-shortcuts-help>

  <p-dialog
    [header]="dialogHeader"
    [(visible)]="dialogVisible"
    [modal]="true"
    [style]="{ minWidth: '30vw' }"
    [draggable]="false"
    [resizable]="false"
  >
    <div class="pb-2">{{dialogMsg}}</div>
    <div class="flex justify-content-center">
      <button
        pButton
        [autofocus]="true"
        pAutoFocus
        pRipple
        label="OK"
        (click)="dialogVisible=false"
      ></button>
    </div>
  </p-dialog>
</div>
