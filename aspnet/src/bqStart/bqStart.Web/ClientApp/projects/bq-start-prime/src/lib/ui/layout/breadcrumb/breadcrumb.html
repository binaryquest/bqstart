
<ol *ngIf="showSelf" class="flex flex-row pr-1 pl-1 items-center">

  <li class="flex flex-row"><a class="cursor-pointer" href="/"><i class="pi pi-home text-blue-500 font-medium"></i></a></li>
  <li class="flex flex-row"><i class="pi pi-angle-right text-surface-500 dark:text-surface-300"></i></li>

  @for (mn of menuStack; track mn.label) {
    <li class="flex flex-row"><a class="text-surface-600 dark:text-surface-200 font-medium">{{mn.label}}</a></li>
    <li class="flex flex-row"><i class="pi pi-angle-right text-surface-500 dark:text-surface-300"></i></li>
  }

  <li class="flex flex-row"><a class="text-surface-600 dark:text-surface-200 font-medium">{{title}}</a></li>
</ol>
