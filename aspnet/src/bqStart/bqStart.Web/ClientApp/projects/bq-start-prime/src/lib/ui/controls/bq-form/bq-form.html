<p-toolbar styleClass="mb-2">
  <div class="p-toolbar-group-right">

    @if (showNew){
      <p-button label="{{'bq-start.buttons.new' | translate}}" icon="pi pi-plus" styleClass="mr-2" (onClick)="create()" size="small"></p-button>
    }
    @if (showEdit){
      <p-button label="{{'bq-start.buttons.edit' | translate}}" icon="pi pi-pencil" styleClass="mr-2" severity="info" (onClick)="edit()" size="small"></p-button>
    }
    @if (showDelete){
      <p-button label="{{'bq-start.buttons.delete' | translate}}" icon="pi pi-trash" styleClass="mr-2" severity="warn" (onClick)="delete()" size="small"></p-button>
    }

    @if (editMode){
      <p-button type="submit" label="{{'bq-start.buttons.save' | translate}}" icon="pi pi-save"
      class="mr-2" [disabled]="!form.form.valid"
      (click)="save()" size="small"></p-button>
    }
    @if (editMode){
      <p-button label="{{'bq-start.buttons.discard' | translate}}" icon="pi pi-times" styleClass="p-button-danger mr-2" (onClick)="discard()" size="small"></p-button>
    }

    @if (additionalActions){
      <ng-container *ngIf="(!editMode && additionalActions) then additionalActions; else defaultRender" [ngTemplateOutlet]="additionalActions"></ng-container>
    }

  </div>

  <div class="p-toolbar-group-right">
    <ng-container *ngIf="(!editMode && additionalActionsOnRight) then additionalActionsOnRight else defaultRender" [ngTemplateOutlet]="additionalActionsOnRight"></ng-container>
  </div>

</p-toolbar>

<div class="card">
  <form #form="ngForm" (ngSubmit)="save()">

    <ng-content></ng-content>

  </form>
</div>

<ng-template #defaultRender>
</ng-template>

<p-blockUI [target]="this" [blocked]="isLoading">
</p-blockUI>
