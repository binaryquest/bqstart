<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BqStartNext</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    .splash-logo{left:50%;top:50%;margin-left:-26px;margin-top:-26px;z-index:2;position:absolute;width:54px}.splash-loader,.splash-loader:after,.splash-loader:before{left:50%;top:50%;margin-left:-45px;margin-top:-45px;position:absolute;vertical-align:middle;background:#c3002f;width:90px;height:90px;border-radius:50%;z-index:1}.splash-loader{background:0 0}.splash-loader:before{content:"";animation:1.5s infinite bounce}.splash-loader:after{content:"";animation:1.5s -.4s infinite bounce}@keyframes bounce{0%{transform:scale(.3);-webkit-transform:scale(.3);opacity:1}100%{transform:scale(2);-webkit-transform:scale(2);opacity:0}}@-webkit-keyframes bounce{0%{transform:scale(.3);-webkit-transform:scale(.3);opacity:1}100%{transform:scale(2);-webkit-transform:scale(2);opacity:0}}.splash-screen{background-color:#f3f3f3;height:100%}
  </style>
</head>
<body>
  <app-root>
    <div class="splash-screen">
      <div class="splash-loader"></div>
      <img class="splash-logo" src="assets/images/logo.svg">
    </div>
  </app-root>
</body>
</html>
